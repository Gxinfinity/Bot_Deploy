<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bot Hoster Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .app-container { max-width: 500px; margin: auto; padding: 20px; }
        .card { background: #1e293b; border-radius: 20px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .form-control, .form-select { background: #334155; border: 1px solid #475569; color: white; border-radius: 12px; padding: 12px; }
        .form-control:focus { background: #334155; color: white; border-color: #38bdf8; box-shadow: none; }
        .btn-deploy { background: linear-gradient(135deg, #38bdf8, #818cf8); border: none; border-radius: 12px; padding: 15px; font-weight: bold; font-size: 1.1rem; }
        .header-icon { font-size: 3rem; margin-bottom: 10px; display: block; text-align: center; }
    </style>
</head>
<body>
    <div class="app-container">
        <span class="header-icon">🤖</span>
        <h3 class="text-center fw-bold mb-4">Bot Deployer Pro</h3>
        
        <div class="card p-4">
            <form action="/deploy" method="post">
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-select" id="botType" onchange="toggleFields()">
                        <option value="Music">Music Bot (High Performance)</option>
                        <option value="Games">Games Bot (Wordchain/Seeker)</option>
                        <option value="Chatbot">AI Chatbot (GPT-4)</option>
                    </select>
                </div>

                <input type="text" name="api_id" placeholder="API ID" class="form-control mb-3" required>
                <input type="text" name="api_hash" placeholder="API HASH" class="form-control mb-3" required>
                <input type="text" name="bot_token" placeholder="Bot Token" class="form-control mb-3" required>
                <input type="text" name="owner_id" placeholder="Owner ID" class="form-control mb-3" required>
                <input type="text" name="sudo_users" placeholder="Sudo Users (Optional)" class="form-control mb-3">
                
                <div id="musicFields">
                    <input type="text" name="session" placeholder="String Session (Required for Music)" class="form-control mb-3">
                </div>
                
                <div id="gameFields" style="display:none;">
                    <input type="text" name="log_group" placeholder="Log Group/Channel ID" class="form-control mb-3">
                </div>

                <button type="submit" class="btn btn-primary btn-deploy w-100 mt-2">Pay ₹599 & Auto-Deploy</button>
            </form>
        </div>
    </div>

    <script>
        function toggleFields() {
            var type = document.getElementById("botType").value;
            document.getElementById("musicFields").style.display = (type === "Music") ? "block" : "none";
            document.getElementById("gameFields").style.display = (type === "Games") ? "block" : "none";
        }
    </script>
</body>
</html>
