<!DOCTYPE html>
<html>
<head>
    <title>Bhai Ka Hosting Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <h2 class="text-center mb-4">🚀 Premium Bot Hosting Panel</h2>
        <div class="card bg-secondary p-4">
            <form action="/deploy" method="post">
                <select name="category" class="form-select mb-3">
                    <option value="Music">Music Bot (₹599)</option>
                    <option value="Games">Games Bot (₹599)</option>
                    <option value="Chatbot">AI Chatbot (₹599)</option>
                </select>
                <input type="text" name="api_id" placeholder="API ID" class="form-control mb-3" required>
                <input type="text" name="api_hash" placeholder="API HASH" class="form-control mb-3" required>
                <input type="text" name="bot_token" placeholder="Bot Token" class="form-control mb-3" required>
                <input type="text" name="owner_id" placeholder="Owner ID" class="form-control mb-3" required>
                <input type="text" name="session" placeholder="String Session (Optional)" class="form-control mb-3">
                
                <button type="submit" class="btn btn-primary w-100">Pay ₹599 & Deploy</button>
            </form>
        </div>
    </div>
</body>
</html>
